version: 2

sources:
  - name: raw
    description: >
      Validated, append-only marketplace records written by the Python ingestion
      service. Invalid records never enter these tables; they are retained in
      quarantine.invalid_records with their validation reason.
    schema: raw
    loaded_at_field: ingested_at
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    tables:
      - name: users
        description: User attribute versions from incremental source files.
        columns:
          - name: user_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: row_hash
            data_tests: [not_null, unique]

      - name: listings
        description: Listing attribute, price, and lifecycle-status versions.
        columns:
          - name: listing_id
            data_tests: [not_null]
          - name: seller_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: row_hash
            data_tests: [not_null, unique]

      - name: events
        description: Buyer engagement events emitted by marketplace sessions.
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: listing_id
            data_tests: [not_null]
          - name: event_at
            data_tests: [not_null]

      - name: orders
        description: Order lifecycle versions; one order can arrive more than once as status changes.
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: listing_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: row_hash
            data_tests: [not_null, unique]
