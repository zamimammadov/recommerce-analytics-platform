version: 2

models:
  - name: mart_listing_funnel
    description: >
      One row per listing with engagement, order, completed-sale, and
      time-to-sale outcomes. Designed for category and conversion analysis.
    columns:
      - name: listing_id
        data_tests: [not_null, unique]
      - name: seller_id
        data_tests: [not_null]
      - name: view_count
        data_tests: [not_null]
      - name: item_gmv_eur
        data_tests: [not_null]

  - name: mart_seller_performance
    description: Seller-level supply, conversion, GMV, and selling-speed metrics.
    columns:
      - name: seller_id
        data_tests: [not_null, unique]
      - name: listing_sell_through_rate
        description: Completed listings divided by all listings created by the seller.

  - name: mart_daily_marketplace_kpis
    description: Daily marketplace supply, engagement, transaction, and conversion KPIs.
    columns:
      - name: metric_date
        data_tests: [not_null, unique]
      - name: new_listings
        data_tests: [not_null]
      - name: views
        data_tests: [not_null]
      - name: gmv_eligible_orders
        description: Orders in paid, shipped, or completed state included in GMV.
        data_tests: [not_null]
      - name: item_gmv_eur
        data_tests: [not_null]

exposures:
  - name: marketplace_operations_dashboard
    label: Marketplace Operations Dashboard
    type: dashboard
    maturity: medium
    url: http://localhost:8501
    description: Local Streamlit dashboard for marketplace health and funnel analysis.
    depends_on:
      - ref('mart_daily_marketplace_kpis')
      - ref('mart_seller_performance')
      - ref('mart_listing_funnel')
    owner:
      name: Zamin Mammadov
      email: portfolio@example.com
