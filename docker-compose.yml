x-app-environment: &app-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-recommerce}
  POSTGRES_USER: ${POSTGRES_USER:-recommerce}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
  DATABASE_URL: postgresql://${POSTGRES_USER:-recommerce}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-recommerce}
  DBT_PROFILES_DIR: /app/dbt

x-airflow-environment: &airflow-environment
  AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-local-admin-only}
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-recommerce}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-recommerce}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-development-only-change-before-deploy}
  PROJECT_ROOT: /opt/airflow/project
  PYTHONPATH: /opt/airflow/project/src
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-recommerce}
  POSTGRES_USER: ${POSTGRES_USER:-recommerce}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
  DATABASE_URL: postgresql://${POSTGRES_USER:-recommerce}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-recommerce}
  DBT_PROFILES_DIR: /opt/airflow/project/dbt

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  profiles: ["orchestration"]
  user: "${AIRFLOW_UID:-1000}:0"
  environment: *airflow-environment
  volumes:
    - ./:/opt/airflow/project
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recommerce}
      POSTGRES_USER: ${POSTGRES_USER:-recommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment: *app-environment
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
      target: dbt
    entrypoint: ["dbt"]
    command: ["--help"]
    working_dir: /app/dbt
    environment: *app-environment
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    profiles: ["dashboard"]
    entrypoint: ["streamlit"]
    command:
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment: *app-environment
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["dev"]
    entrypoint: []
    environment: *app-environment
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./:/app

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command:
      - bash
      - -ceu
      - |
        airflow db migrate
        if airflow users list --output json | python -c 'import json, os, sys; sys.exit(not any(user["username"] == os.environ["AIRFLOW_ADMIN_USER"] for user in json.load(sys.stdin)))'; then
          echo "Configured Airflow admin already exists."
        else
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USER}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Portfolio \
            --lastname Admin \
            --role Admin \
            --email admin@example.invalid
        fi

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 12
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  airflow-logs:
